<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운송 일일업무일지 [보안 및 연동]</title>
    <!-- html2pdf.js 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- 🛡️ 최상단 강제 보안 스크립트 (우클릭, F12, 소스보기 즉시 차단) -->
    <script>
      window.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          e.stopPropagation();
          return false;
      }, true);

      window.addEventListener('keydown', function(e) {
          if (
              e.key === 'F12' || 
              e.keyCode === 123 ||
              (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) || 
              (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
          ) {
              e.preventDefault();
              e.stopPropagation();
              return false;
          }
      }, true);
    </script>

    <!-- 파이어베이스 SDK 연동 -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * { 
            box-sizing: border-box; 
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
            font-size: 12px; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        input, select, textarea {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }

        html, body { margin: 0; padding: 0; background-color: #f8f8f8; }
        body { padding: 20px 15px 80px 15px; color: #333; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; background: #fff; padding: 20px; border: 1px solid #e0e0e0; display: flex; flex-direction: column; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #a30000; padding-bottom: 8px; margin-bottom: 15px; }
        .title-area { display: flex; align-items: center; gap: 8px; }
        .title-area h2 { margin: 0; color: #a30000; font-size: 18px; }
        .help-icon { display: inline-block; width: 16px; height: 16px; background: #aaa; color: #fff; border-radius: 50%; text-align: center; line-height: 16px; font-size: 11px; font-weight: bold; }
        .btn-group { display: flex; gap: 5px; }
        .btn { background-color: #8c8c8c; color: white; border: none; padding: 5px 14px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn:hover { background-color: #737373; }
        .btn-save { background-color: #4A90E2; }
        .btn-save:hover { background-color: #357ABD; }
        .btn-pdf { background-color: #27ae60; }
        .btn-pdf:hover { background-color: #219150; }
        .btn-photo { background-color: #e67e22; }
        .btn-photo:hover { background-color: #d35400; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 30px; margin-bottom: 15px; }
        .info-row { display: flex; align-items: center; }
        .info-label { width: 75px; font-weight: bold; display: flex; align-items: center; }
        .info-label.required::before { content: "✓ "; color: #d9534f; margin-right: 3px; }
        .info-input { display: flex; align-items: center; gap: 5px; flex: 1; }
        input[type="text"], input[type="date"], select, textarea { padding: 2px 5px; border: 1px solid #ccc; background-color: #fff; border-radius: 2px; width: 100%; }
        input[type="text"], input[type="date"], select { height: 24px; }
        select { cursor: pointer; }
        .section-title { color: #a30000; font-size: 14px; font-weight: bold; margin-top: 15px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: flex-end; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        th, td { border: 1px solid #dcdcdc; padding: 4px; text-align: center; }
        th { background-color: #8c8c8c; color: white; font-weight: normal; }
        .approval-box { border: 1px solid #ccc; padding: 10px; display: flex; justify-content: flex-end; margin-bottom: 15px; background-color: #fff; page-break-inside: avoid; break-inside: avoid; }
        .approval-table { width: auto; margin-bottom: 0; border-collapse: collapse; }
        .approval-table th { background-color: #fff; color: #333; width: 100px; font-weight: bold; font-size: 13px; padding: 6px; border: 1px solid #dcdcdc; }
        .approval-td { height: 60px; width: 100px; position: relative; cursor: pointer; vertical-align: middle; background-color: #fff; transition: background-color 0.2s; border: 1px solid #dcdcdc; }
        .approval-td:hover { background-color: #f0f7ff; }
        img:not([src]), img[src=""] { display: none !important; }
        .approval-td img { max-width: 90px; max-height: 52px; object-fit: contain; margin: 0 auto; display: block; }
        .sign-delete-btn { position: absolute; top: 2px; right: 2px; background: rgba(163, 0, 0, 0.85); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: none; justify-content: center; align-items: center; line-height: 1; z-index: 5; transition: background 0.2s; }
        .approval-td:hover .sign-delete-btn.has-image { display: flex; }
        .sign-delete-btn:hover { background: #a30000; }
        .approval-header-side { writing-mode: vertical-rl; letter-spacing: 6px; padding: 0 10px; background-color: #fff !important; color: #333 !important; font-weight: bold; font-size: 13px; border: 1px solid #dcdcdc; }
        .worker-table input[type="text"] { border: 1px solid #ccc; border-radius: 2px; padding: 2px 4px; text-align: center; width: 90%; height: 22px; background: #fff; }
        .worker-table td { padding: 3px; height: 28px; }
        .worker-table select { border: 1px solid #ccc; border-radius: 2px; width: 90%; height: 22px; text-align-last: center; background: #fff; }
        .worker-table td.no-input { padding: 4px; background-color: #f5f5f5; }
        .work-log-box { background-color: #fbf7e8; border: 1px solid #e2d9c2; padding: 12px; margin-top: 5px; margin-bottom: 0; display: flex; gap: 15px; align-items: stretch; page-break-inside: auto; break-inside: auto; }
        .work-log-title { font-weight: bold; width: 100px; flex-shrink: 0; padding-top: 3px; }
        .work-log-textarea, .work-log-div { width: 100%; min-height: 120px; background-color: #fff; border: 1px solid #d3cbb6; line-height: 1.6; padding: 8px; white-space: pre-wrap; word-break: break-all; }
        .work-log-textarea { resize: none; overflow-y: hidden; }
        .photo-grid-box { background-color: #fbf7e8; border: 1px solid #e2d9c2; padding: 12px; margin-top: 10px; display: flex; gap: 15px; align-items: flex-start; page-break-inside: avoid !important; break-inside: avoid !important; }
        .photo-grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
        .photo-card { border: 1px dashed #c5bca8; background-color: #fff; height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; cursor: pointer; overflow: hidden; transition: background-color 0.2s; page-break-inside: avoid !important; break-inside: avoid !important; }
        .photo-card:hover { background-color: #f4efe2; }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; }
        .photo-placeholder { color: #888; text-align: center; font-size: 11px; pointer-events: none; display: block; }
        .photo-placeholder span { font-size: 20px; display: block; margin-bottom: 4px; color: #aaa; }
        .photo-delete-btn { position: absolute; top: 6px; right: 6px; background: rgba(163, 0, 0, 0.85); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; display: none; justify-content: center; align-items: center; line-height: 1; z-index: 5; transition: background 0.2s; }
        .photo-card:hover .photo-delete-btn.has-image { display: flex; }
        .photo-delete-btn:hover { background: #a30000; }

        /* 🔑 비밀번호 접속 인증 모달 스타일 */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #0f172a; z-index: 1000000; display: flex; align-items: center; justify-content: center;
        }
        .login-box {
            background: white; padding: 30px 40px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; width: 350px;
        }
        .login-box h2 { margin-top: 0; font-size: 20px; color: #0f172a; margin-bottom: 8px; }
        .login-box p { font-size: 13px; color: #64748b; margin-bottom: 20px; }
        .login-box input[type="password"] {
            width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px;
            font-size: 15px; margin-bottom: 15px; text-align: center; letter-spacing: 3px; outline: none;
        }
        .login-box button {
            width: 100%; padding: 10px; border: none; border-radius: 6px; background-color: #3b82f6;
            color: white; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s;
        }
        .login-box button:hover { background-color: #2563eb; }

        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            html, body { height: auto; background-color: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            body { padding: 0; display: block; }
            .container { border: none; padding: 0; width: 100%; max-width: 100%; box-shadow: none; }
            .btn-group, .help-icon, .photo-delete-btn, .sign-delete-btn, #login-overlay { display: none !important; }
            input[type="text"], input[type="date"], select, textarea { border: none !important; background: transparent !important; appearance: none; -webkit-appearance: none; }
            table, th, td { border: 1px solid #777 !important; page-break-inside: avoid; break-inside: avoid; }
            .approval-box { border: 1px solid #777 !important; background-color: #fff !important; }
            .work-log-box { background-color: #fff !important; border: 1px solid #777 !important; }
            .photo-grid-box { background-color: #fff !important; border: 1px solid #777 !important; margin-top: 15px; }
            .work-log-div { border: none !important; padding: 0 !important; }
            .photo-card { border: 1px solid #777 !important; }
        }
    </style>
</head>
<body>

<!-- 🔑 비밀번호 접속 인증 오버레이 모달 -->
<div id="login-overlay">
    <div class="login-box">
        <h2>🔒 운송일지 접속 인증</h2>
        <p>시스템 접근을 위해 비밀번호를 입력하세요.</p>
        <input type="password" id="sys-pass-input" placeholder="비밀번호 입력" onkeyup="if(event.key==='Enter') checkSystemPassword()">
        <button onclick="checkSystemPassword()">접속하기</button>
    </div>
</div>

<input type="file" id="sign-damdang-file" accept="image/*" style="display:none;" onchange="loadSignImage(this, 'img-damdang', 'del-sign-damdang')">
<input type="file" id="sign-team-file" accept="image/*" style="display:none;" onchange="loadSignImage(this, 'img-team', 'del-sign-team')">
<input type="file" id="sign-sojang-file" accept="image/*" style="display:none;" onchange="loadSignImage(this, 'img-sojang', 'del-sign-sojang')">

<div class="container" id="pdf-container">
    <div class="header">
        <div class="title-area">
            <h2>운송 일일업무일지</h2>
            <span class="help-icon">?</span>
        </div>
        <div class="btn-group">
            <button class="btn">결재</button>
            <button class="btn btn-save" onclick="saveData()">저장</button>
            <button class="btn" onclick="window.print()">인쇄</button>
            <button class="btn btn-pdf" onclick="saveAsPDF()">PDF 저장</button>
            <button class="btn btn-photo" onclick="scrollToPhotoSection()">사진</button>
        </div>
    </div>

    <div class="info-grid">
        <div class="info-row">
            <div class="info-label required">일자</div>
            <div class="info-input" style="justify-content: flex-start;">
                <input type="date" id="work-date" onchange="updateDayOfWeek(); loadSavedDataFromServer();" style="width: 130px;">
            </div>
        </div>

        <div class="info-row">
            <div class="info-label required">상태</div>
            <div class="info-input" style="justify-content: flex-start;">
                <select id="status-select" style="width: 140px;">
                    <option value="일지완료" selected>일지완료</option>
                    <option value="작성중">작성중</option>
                    <option value="결재대기">결재대기</option>
                </select>
            </div>
        </div>

        <div class="info-row">
            <div class="info-label">담당자</div>
            <div class="info-input" style="justify-content: flex-start;">
                <input type="text" id="user-name-input" value="이욱호" placeholder="성명 입력" style="width: 175px;">
            </div>
        </div>

        <div class="info-row">
            <div class="info-label">담당부서</div>
            <div class="info-input" style="justify-content: flex-start;">
                <select id="dept-select" style="width: 140px;">
                    <option value="운송" selected>운송</option>
                    <option value="점검팀">점검팀</option>
                    <option value="기술지원">기술지원</option>
                    <option value="시설운영">시설운영</option>
                </select>
            </div>
        </div>
    </div>

    <div class="approval-box">
        <table class="approval-table">
            <tr>
                <td rowspan="2" class="approval-header-side">결재</td>
                <th>담 당</th>
                <th>팀 장</th>
                <th>소 장</th>
            </tr>
            <tr>
                <td class="approval-td" onclick="triggerFileInput('sign-damdang-file')" title="클릭하여 서명/도장 이미지 변경">
                    <button type="button" class="sign-delete-btn" id="del-sign-damdang" onclick="deleteSign(event, 'img-damdang', 'sign-damdang-file', 'del-sign-damdang')">✕</button>
                    <img id="img-damdang" alt="담당 서명">
                </td>
                <td class="approval-td" onclick="triggerFileInput('sign-team-file')" title="클릭하여 서명/도장 이미지 변경">
                    <button type="button" class="sign-delete-btn" id="del-sign-team" onclick="deleteSign(event, 'img-team', 'sign-team-file', 'del-sign-team')">✕</button>
                    <img id="img-team" alt="팀장 서명">
                </td>
                <td class="approval-td" onclick="triggerFileInput('sign-sojang-file')" title="클릭하여 서명/도장 이미지 변경">
                    <button type="button" class="sign-delete-btn" id="del-sign-sojang" onclick="deleteSign(event, 'img-sojang', 'sign-sojang-file', 'del-sign-sojang')">✕</button>
                    <img id="img-sojang" alt="소장 서명">
                </td>
            </tr>
        </table>
    </div>

    <div class="section-title">날씨</div>
    <table>
        <colgroup>
            <col style="width: 30%;">
            <col style="width: 70%;">
        </colgroup>
        <thead>
            <tr>
                <th>구분</th>
                <th>요일 / 날씨</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>요일</td>
                <td>
                    <select id="day-select" style="max-width: 180px;">
                        <option value="일요일">일요일</option>
                        <option value="월요일">월요일</option>
                        <option value="화요일">화요일</option>
                        <option value="수요일">수요일</option>
                        <option value="목요일">목요일</option>
                        <option value="금요일">금요일</option>
                        <option value="토요일">토요일</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>날씨</td>
                <td>
                    <select id="weather-select" style="max-width: 180px;">
                        <option value="맑음" selected>맑음</option>
                        <option value="구름조금">구름조금</option>
                        <option value="흐림">흐림</option>
                        <option value="비">비</option>
                        <option value="눈">눈</option>
                    </select>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="section-title">
        <span>근무자 <span id="leave-link-status" data-html2canvas-ignore="true" style="font-size:11px; font-weight:normal; color:#64748b; margin-left:6px;"></span></span>
        <button type="button" id="btn-leave-fill" data-html2canvas-ignore="true" onclick="autoFillWorkers(true)" style="padding:2px 8px; font-size:11px; cursor:pointer;">🔄 연차 데이터로 채우기</button>
    </div>
    <table class="worker-table" id="worker-table">
        <colgroup>
            <col style="width: 8%;">
            <col style="width: 18%;">
            <col style="width: 18.5%;">
            <col style="width: 18.5%;">
            <col style="width: 18.5%;">
            <col style="width: 18.5%;">
        </colgroup>
        <thead>
            <tr>
                <th>구분</th>
                <th>성명</th>
                <th>주간</th>
                <th>야간</th>
                <th>휴무</th>
                <th>기타</th>
            </tr>
        </thead>
        <tbody>
            <script>
                for(let i=1; i<=7; i++){
                    document.write(`
                        <tr class="worker-row">
                            <td class="no-input">${i}</td>
                            <td><input type="text" class="w-name" value="" placeholder="성명 입력"></td>
                            <td><select class="w-jugan"><option value="">-</option><option value="주간">주간</option><option value="당직">당직</option></select></td>
                            <td><select class="w-yagan"><option value="">-</option><option value="야간">야간</option></select></td>
                            <td>
                                <select class="w-humu">
                                    <option value="">-</option>
                                    <option value="휴무">휴무</option>
                                    <option value="대체">대체</option>
                                    <option value="대체반차">대체반차</option>
                                    <option value="연차">연차</option>
                                    <option value="반차">반차</option>
                                    <option value="당직휴무">당직휴무</option>
                                    <option value="조휴">조휴</option>
                                    <option value="축휴">축휴</option>
                                </select>
                            </td>
                            <td><select class="w-gita"><option value="">-</option><option value="출장">출장</option><option value="교육">교육</option><option value="교육반차">교육반차</option></select></td>
                        </tr>
                    `);
                }
            </script>
        </tbody>
    </table>

    <div class="work-log-box" id="work-log-box-container">
        <div class="work-log-title">운송 업무 내역</div>
        <textarea id="work-log-content" class="work-log-textarea" oninput="autoResizeTextarea(this)" placeholder="업무 내역을 입력하세요."></textarea>
    </div>

    <div class="photo-grid-box html2pdf__page-break" id="photo-section">
        <div class="work-log-title">현장 사진</div>
        <div class="photo-grid-container">
            <div class="photo-card" onclick="triggerFileInput('photo-file-1')">
                <button type="button" class="photo-delete-btn" id="delete-btn-1" onclick="deletePhoto(event, 1)">✕</button>
                <div class="photo-placeholder" id="placeholder-1">
                    <span>📷</span>사진 등록 1
                </div>
                <img id="img-photo-1" alt="현장사진 1">
                <input type="file" id="photo-file-1" accept="image/*" style="display:none;" onchange="loadPhotoImage(this, 1)">
            </div>
            <div class="photo-card" onclick="triggerFileInput('photo-file-2')">
                <button type="button" class="photo-delete-btn" id="delete-btn-2" onclick="deletePhoto(event, 2)">✕</button>
                <div class="photo-placeholder" id="placeholder-2">
                    <span>📷</span>사진 등록 2
                </div>
                <img id="img-photo-2" alt="현장사진 2">
                <input type="file" id="photo-file-2" accept="image/*" style="display:none;" onchange="loadPhotoImage(this, 2)">
            </div>
            <div class="photo-card" onclick="triggerFileInput('photo-file-3')">
                <button type="button" class="photo-delete-btn" id="delete-btn-3" onclick="deletePhoto(event, 3)">✕</button>
                <div class="photo-placeholder" id="placeholder-3">
                    <span>📷</span>사진 등록 3
                </div>
                <img id="img-photo-3" alt="현장사진 3">
                <input type="file" id="photo-file-3" accept="image/*" style="display:none;" onchange="loadPhotoImage(this, 3)">
            </div>
        </div>
    </div>
</div>

<script>
    // 🛡️ 파이어베이스 설정 정보 난독화 디코딩 (비밀번호 연동용)

    function compressImage(file, maxWidth, quality, callback) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function (event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function () {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }

                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', quality));
            };
        };
    }

    function loadSignImage(input, imgId, delBtnId) {

        const workDate = document.getElementById("work-date").value;
        if (!workDate) return;

            row.querySelector(".w-name").value = "";
            row.querySelector(".w-jugan").value = "";
            row.querySelector(".w-yagan").value = "";
            row.querySelector(".w-humu").value = "";
            row.querySelector(".w-gita").value = "";
        });

        const textarea = document.getElementById("work-log-content");
        if (textarea) {
            textarea.value = "";
            autoResizeTextarea(textarea);
        }

        for (let i = 1; i <= 3; i++) {
            deletePhoto({ stopPropagation: () => {} }, i);
        }

        ['img-damdang', 'img-team', 'img-sojang'].forEach((imgId, idx) => {
            const btnIds = ['del-sign-damdang', 'del-sign-team', 'del-sign-sojang'];
            const img = document.getElementById(imgId);
            const delBtn = document.getElementById(btnIds[idx]);
            img.removeAttribute('src');
            img.style.display = "none";
            delBtn.classList.remove('has-image');
        });

        // 2. 서버로부터 해당 날짜의 데이터를 조회하여 채워넣기 (unsong 팀 식별자 사용)
        fetch(`${GAS_WEB_APP_URL}?workDate=${workDate}`)
        .then(res => res.json())
        .then(res => {
            if (res.status === "success" && res.data) {
                const teamData = res.data["unsong"] || res.data;
                if (!teamData) return;

                const data = teamData.contentData || teamData;

                if (data.status) document.getElementById("status-select").value = data.status;
                if (data.userName) document.getElementById("user-name-input").value = data.userName;
                if (data.dept) document.getElementById("dept-select").value = data.dept;
                if (data.weather) document.getElementById("weather-select").value = data.weather;
                
                const logContentVal = data.logContent !== undefined ? data.logContent : (data.workLogContent !== undefined ? data.workLogContent : "");
                document.getElementById("work-log-content").value = logContentVal;
                autoResizeTextarea(document.getElementById("work-log-content"));

                const roles = [
                    { key: 'imgDamdang', id: 'img-damdang', btn: 'del-sign-damdang' },
                    { key: 'imgTeam', id: 'img-team', btn: 'del-sign-team' },
                    { key: 'imgSojang', id: 'img-sojang', btn: 'del-sign-sojang' }
                ];

                roles.forEach(role => {
                    if (data[role.key]) {
                        const img = document.getElementById(role.id);
                        const delBtn = document.getElementById(role.btn);
                        img.src = data[role.key];
                        img.style.display = "block";
                        delBtn.classList.add('has-image');
                    }
                });

                const photoUrls = teamData.photoUrls || data.photos;
                if (photoUrls && Array.isArray(photoUrls) && photoUrls.length > 0) {
                    photoUrls.forEach((url, i) => {
                        const idx = i + 1;
                        if (url) {
                            const img = document.getElementById(`img-photo-${idx}`);
                            const placeholder = document.getElementById(`placeholder-${idx}`);
                            const deleteBtn = document.getElementById(`delete-btn-${idx}`);

                            img.src = url;
                            img.style.display = "block";
                            placeholder.style.display = "none";
                            deleteBtn.classList.add('has-image');
                        }
                    });
                }

                // 서버에 저장된 근무자 데이터가 있으면 먼저 채워넣음
                if (data.workers && Array.isArray(data.workers) && data.workers.length > 0) {
                    workerRows.forEach((row, idx) => {
                        if (data.workers[idx]) {
                            row.querySelector(".w-name").value = data.workers[idx].name || "";
                            row.querySelector(".w-jugan").value = data.workers[idx].jugan || "";
                            row.querySelector(".w-yagan").value = data.workers[idx].yagan || "";
                            row.querySelector(".w-humu").value = data.workers[idx].humu || "";
                            row.querySelector(".w-gita").value = data.workers[idx].gita || "";
                        }
                    });
                }
            }
        })
        .then(() => { 
            if (document.getElementById("work-date").value === workDate) { 
                fillWorkersIfEmpty(); 
            } 
        })
        .catch(err => {
            console.error("데이터 조회 실패:", err);
            if (document.getElementById("work-date").value === workDate) { 
                fillWorkersIfEmpty(); 
            }
        });
    }

        textarea.parentNode.insertBefore(tempDiv, textarea);

            margin:       10,
            filename:     filename,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },

    // ===== 연차관리 데이터로 근무자 자동 채움 (운송 연동) =====
    const LEAVE_DEPT = '운송';
    const WORKER_ROWS = 7;

    function localDateStr() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

    function detectCongratKind(reason) {
        const r = String(reason || '');
        if (/조휴|장례|부고|조문|별세|사망|발인|상중|(?:부친|모친|빙부|빙모|부모|조부모|조부|조모|외조부|외조모|장인|장모|시부모|시부|시모|배우자|형제|자매|자녀|아들|딸|처|남편|아내|부|모)상/.test(r)) return '조휴';
        return '축휴';
    }

    const COMBO_RANK = { '휴무': 0, '연차': 1, '조휴': 2, '축휴': 2, '교육': 3, '교육반차': 4, '반차': 5, '대체': 6, '대체반차': 7 };
    function leaveToCombo(type, reason) {
        if (type === '휴무') return { col: 'humu', val: '휴무' };
        if (type === '연차') return { col: 'humu', val: '연차' };
        if (type === '오전반차' || type === '오후반차') return { col: 'humu', val: '반차' };
        if (type === '대체반차') return { col: 'humu', val: '대체반차' };
        if (type === '대체휴가') return { col: 'humu', val: '대체' };
        if (type === '축휴' || type === '조휴') return { col: 'humu', val: type };
        if (type === '경조휴가') return { col: 'humu', val: detectCongratKind(reason) };
        if (type === '교육') return { col: 'gita', val: '교육' };
        if (type === '교육오전반차' || type === '교육오후반차') return { col: 'gita', val: '교육반차' };
        return null;
    }
    function statusOf(emp, date) {
        let best = null;
        (emp.history || []).forEach(h => {
            if (!h.start || h.start > date || (h.end || h.start) < date) return;
            const c = leaveToCombo(h.type, h.reason);
            if (c && (!best || COMBO_RANK[c.val] < COMBO_RANK[best.val])) best = c;
        });
        return best;
    }
    const stKey = st => st ? st.col + ':' + st.val : '';

    function rankOf(pos) {
        const p = String(pos || '');
        if (p.includes('팀장')) return 1;
        if (p.includes('주임')) return 2;
        if (p.includes('반장')) return 3;
        if (p.includes('기사')) return 4;
        return 5;
    }
    function compareByRank(a, b) {
        return (rankOf(a.position) - rankOf(b.position))
            || String(a.joinDate || '9999-12-31').localeCompare(String(b.joinDate || '9999-12-31'))
            || ((Number(a.no) || 9999) - (Number(b.no) || 9999));
    }

    function buildWorkerRows(members) {
        let rows = members.map((m, i) => ({ order: i, people: [m] }));
        const key = r => stKey(r.people[0].st);
        const sameKey = r => r.people.every(p => stKey(p.st) === key(r));
        while (rows.length > WORKER_ROWS) {
            let pair = null;
            for (let i = 0; i < rows.length && !pair; i++) for (let j = i + 1; j < rows.length && !pair; j++)
                if (sameKey(rows[i]) && sameKey(rows[j]) && key(rows[i]) === key(rows[j]) && key(rows[i]) !== '') pair = [i, j];
            for (let i = 0; i < rows.length && !pair; i++) for (let j = i + 1; j < rows.length && !pair; j++)
                if (sameKey(rows[i]) && sameKey(rows[j]) && key(rows[i]) === key(rows[j])) pair = [i, j];
            if (!pair) pair = [rows.length - 2, rows.length - 1];
            const merged = { order: Math.min(rows[pair[0]].order, rows[pair[1]].order), people: rows[pair[0]].people.concat(rows[pair[1]].people) };
            rows = rows.filter((_, idx) => idx !== pair[0] && idx !== pair[1]);
            rows.push(merged);
        }
        rows.sort((a, b) => a.order - b.order);
        return rows.map(r => {
            if (sameKey(r)) {
                const st = r.people[0].st;
                return { name: r.people.map(p => p.name).join(', '), humu: st && st.col === 'humu' ? st.val : '', gita: st && st.col === 'gita' ? st.val : '' };
            }
            return { name: r.people.map(p => p.name + (p.st ? '(' + p.st.val + ')' : '')).join(', '), humu: '', gita: '' };
        });
    }

    async function fetchLeaveEmployees() {
        const snap = await firebase.firestore().collection('annual_system').doc('dataStore').get();
        const d = snap.exists ? snap.data() : null;
        return Array.isArray(d && d.employees) ? d.employees : null;
    }

    function workerRowEls() { return document.querySelectorAll('.worker-row'); }
    function workersHaveData() {
        let has = false;
        workerRowEls().forEach(r => {
            ['.w-name', '.w-jugan', '.w-yagan', '.w-humu', '.w-gita'].forEach(c => { if (r.querySelector(c).value !== '') has = true; });
        });
        return has;
    }
    function fitNameFont(input) { input.style.fontSize = input.value.length > 6 ? '11px' : ''; }

    function fillWorkersIfEmpty() {
        const date = document.getElementById('work-date').value;
        const btn = document.getElementById('btn-leave-fill');
        const past = isPastDate(date);
        if (btn) { btn.disabled = past; btn.style.opacity = past ? '0.4' : '1'; btn.style.cursor = past ? 'not-allowed' : 'pointer'; btn.title = past ? '과거 날짜는 연차 데이터로 채울 수 없습니다' : ''; }
        
        // 이미 근무자 데이터(이름 등)가 입력되어 있으면 연차 데이터로 강제 초기화하지 않고 동기화만 검사
        if (workersHaveData()) { 
            if (!past) syncSavedWorkers(date); 
            return; 
        }
        if (past) { setLinkStatus('과거 날짜는 연차 데이터로 채우지 않습니다. 직접 입력해 주세요.', '#64748b'); return; }
        autoFillWorkers(false);
    }

    const HUMU_FROM_LEAVE = ['휴무', '대체', '대체반차', '연차', '반차', '조휴', '축휴'];
    const GITA_FROM_LEAVE = ['교육', '교육반차'];
    async function syncSavedWorkers(date) {
        let emps;
        try { emps = await fetchLeaveEmployees(); } catch (e) { console.error('연차 데이터 비교 실패:', e); return; }
        if (document.getElementById('work-date').value !== date || !emps) return;
        const byName = {};
        emps.filter(e => e.dept === LEAVE_DEPT && !(e.joinDate && e.joinDate > date) && !(e.retireDate && e.retireDate < date))
            .forEach(e => { byName[e.name] = statusOf(e, date); });
        
        let changedCount = 0;
        workerRowEls().forEach(row => {
            const raw = row.querySelector('.w-name').value;
            const names = raw.split(/[,，]/).map(x => x.trim()).filter(Boolean);
            if (!names.length) return;
            
            const humu = row.querySelector('.w-humu'), gita = row.querySelector('.w-gita');
            // 사용자가 이미 수동으로 선택한 값이 있다면 연차 데이터가 없거나 다르더라도 절대 지우지 않고 유지함
            if (humu.value !== "" || gita.value !== "") return;

            // 단 한 명이라도 연차 시스템에 해당 날짜 휴가 데이터가 있는 경우에만 자동 채움 반영
            if (names.some(n => n in byName && byName[n])) {
                const sts = names.map(n => byName[n]).filter(Boolean);
                if (sts.length > 0) {
                    const want = sts[0];
                    if (want.col === 'humu' && humu.value === "") { humu.value = want.val; changedCount++; }
                    else if (want.col === 'gita' && gita.value === "") { gita.value = want.val; changedCount++; }
                }
            }
        });

        setLinkStatus(changedCount > 0 
            ? '✅ 연차 시스템 기준으로 ' + changedCount + '건 자동 반영됨' 
            : '✅ 연차 데이터와 동기화 완료', '#059669');
    }

    async function autoFillWorkers(force) {
        const date = document.getElementById('work-date').value;
        if (!date) { if (force) alert('일자를 먼저 선택하세요.'); return; }
        if (isPastDate(date)) { if (force) alert('과거 날짜는 연차 데이터로 채울 수 없습니다. 직접 입력해 주세요.'); return; }
        if (force && workersHaveData() && !confirm('근무자 표를 연차 데이터로 다시 채웁니다.\n입력해 둔 성명과 주간/야간/휴무/기타 선택은 모두 바뀝니다. 계속할까요?')) return;
        setLinkStatus('연차 데이터 불러오는 중...', '#64748b');
        let emps;
        try { emps = await fetchLeaveEmployees(); }
        catch (e) {
            console.error('연차 데이터 연동 실패:', e);
            if (document.getElementById('work-date').value === date) setLinkStatus('⚠️ 연차 데이터 연동 실패 (직접 입력해 주세요)', '#dc2626');
            return;
        }
        if (document.getElementById('work-date').value !== date) return;
        if (!emps) { setLinkStatus('⚠️ 연차 데이터가 없습니다.', '#dc2626'); return; }

        const members = emps.filter(e => e.dept === LEAVE_DEPT
                && !(e.joinDate && e.joinDate > date)
                && !(e.retireDate && e.retireDate < date))
            .sort(compareByRank)
            .map(e => ({ name: e.name, st: statusOf(e, date) }));

        const rows = buildWorkerRows(members);
        workerRowEls().forEach((row, i) => {
            const r = rows[i] || { name: '', humu: '', gita: '' };
            const nameEl = row.querySelector('.w-name');
            nameEl.value = r.name; fitNameFont(nameEl);
            row.querySelector('.w-jugan').value = '';
            row.querySelector('.w-yagan').value = '';
            row.querySelector('.w-humu').value = r.humu;
            row.querySelector('.w-gita').value = r.gita;
        });
        const onLeave = members.filter(m => m.st).length;
        setLinkStatus('✅ 연차 데이터 반영됨 (재직 ' + members.length + '명, 휴가·교육 ' + onLeave + '명)' + (members.length > WORKER_ROWS ? ' · 같은 상태끼리 한 칸에 표시' : ''), '#059669');
    }

    window.onload = function() {
        document.getElementById("work-date").value = getTodayString();
        updateDayOfWeek();
        loadSavedDataFromServer();
        
        const textarea = document.getElementById("work-log-content");
        if (textarea) autoResizeTextarea(textarea);
    };
</script>
